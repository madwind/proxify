name: Build and Push Proxify Docker Image

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish_docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: madwind/proxify

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    outputs:
      app_version: ${{ steps.extract_app_version.outputs.app_version }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read package metadata from Cargo.toml
        id: extract_app_version
        run: |
          APP_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          RUST_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          echo "rust_version=$RUST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools cmake

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.extract_app_version.outputs.rust_version }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ steps.extract_app_version.outputs.rust_version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-${{ matrix.target }}-${{ steps.extract_app_version.outputs.rust_version }}-

      - name: Build static binary
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          target_key=${RUST_TARGET//-/_}
          export "CARGO_TARGET_${target_key^^}_LINKER=musl-gcc"
          export "CC_${target_key}=musl-gcc"
          cargo build --release --locked --target "$RUST_TARGET"
          mkdir -p dist
          cp "target/$RUST_TARGET/release/proxify" dist/proxify
          elf_headers=$(readelf -l dist/proxify)
          if [[ "$elf_headers" == *INTERP* ]]; then
            echo "The binary requires a dynamic loader and cannot run in scratch" >&2
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: proxify-${{ env.PLATFORM_PAIR }}
          path: dist/proxify
          if-no-files-found: error
          retention-days: 7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=proxify-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=proxify-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ env.APP_VERSION }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
