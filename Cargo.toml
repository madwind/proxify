[package]
name = "proxify"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "rustls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
