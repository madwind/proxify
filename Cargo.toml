[package]
name = "proxify"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
